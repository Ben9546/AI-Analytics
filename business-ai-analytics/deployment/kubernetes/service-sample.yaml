apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: business-ai # Assuming a dedicated namespace
  labels:
    app: api-gateway
spec:
  type: ClusterIP # Default type, exposes the service on an internal IP in the cluster.
                 # Change to LoadBalancer to expose externally on cloud providers (e.g., AWS ELB, GCP Load Balancer).
                 # Change to NodePort to expose on a static port on each node's IP (mainly for development/testing).
  selector:
    app: api-gateway # This must match the labels of the pods targeted by this service (from the Deployment)
  ports:
  - name: http
    protocol: TCP
    port: 80       # Port on which the service is exposed within the cluster
    targetPort: 8000 # Port on the pods/containers (must match containerPort in Deployment)

---
